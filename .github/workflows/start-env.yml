name: Mon workflow avec des variables
on : [push]


jobs:
  build:
    if: ${{ GITHUB.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "build in prod"
    
  deploy:
    needs: [build]
    if: ${{ GITHUB.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy in prod"
    
