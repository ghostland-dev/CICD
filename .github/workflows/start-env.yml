name: Mon workflow avec des variables
on : [push]


jobs:
  build:
    if: ${{ GITHUB.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - id: step1
        run: | 
          echo $GITHUB_ENV
          echo FROM_STEP_1=value_step_1 >> $GITHUB_ENV
      - id: step2
        run: |
          echo $FROM_STEP_1
          echo ${{ env.FROM_STEP_1 }}
    
  deploy:
    needs: [build]
    if: ${{ GITHUB.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy in prod"
    
