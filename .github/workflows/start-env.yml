name: Mon workflow avec des variables
on : [push]


jobs:
  build:
    if: ${{ GITHUB.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      FROM_BUILD: ${{ steps.step1.outputs.FROM_STEP_1}}
    steps:
      - id: step1
        run: | 
          echo $GITHUB_OUTPUT
          echo FROM_STEP_1=value_step_1 >> $GITHUB_OUTPUT
      - id: step2
        run: |
          echo ${{steps.step1.outputs.FROM_STEP_1 }}
    
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy in prod"
      - run: echo  echo ${{ needs.build.outputs.FROM_BUILD }}
    
