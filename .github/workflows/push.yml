name: Mon workflow avec des variables
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    container: 
      image: node:18
    steps:
      - run: apt install sudo
      - run: apt update -y && sudo apt install redis-tools -y
      - run: redis-cli -h redis ping
      
