name: Mon workflow avec des variables
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo fruit=pomme >> $GITHUB_OUTPUT
        id: Step-1
      - run: echo ::error::fruit est égale à ${{ steps.Step-1.outputs.fruit }} devrait être 
        if: ${{ steps.Step-1.outputs.fruit }} != "poire"
 

