name: Mon workflow avec des variables
on: [push]


jobs:
  test-articat:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello world" >> exemple.txt
      - uses: actions/upload-artifact@v3
        with:
          name: mon-artifact
          path: ./exemple.txt
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: mon-second
          path: ./ici
      - run: |
          ls
          echo ----------------------
          ls ./ici
          echo ----------------------
          cat /.ici/exemple.txt
