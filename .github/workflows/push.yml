name: Mon workflow avec des variables
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - run: sudo apt update -y && sudo apt install redis-tools -y
      - run: redis-cli -h localhost -p 6379 ping 
      
