name: Mon workflow avec des variables
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 01
      - name: Installation des dépendances de projet
        uses: actions/setup-node@v4
      # Step 02
      - name: Récuperer les données de répertoire
        uses: actions/checkout@v4
      # Step 03
      - name: configure cache for the app 
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ hashFiles('./vite-project/package-lock.json') }}
          path: ./vite-project/.npm
        run: ls la ./vite-project/ 
