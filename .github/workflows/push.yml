name: Mon workflow avec des variables
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo 123 > test.txt
          git config --global user.email "ismail.mouyahada@gmail.com"
          git config --global user.name "FROM CICD"
          git add test.txt
          git commit -m "test"
          git push origin main